<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PRM</title>

  <!-- Set the theme before first paint, or the page flashes the wrong one. -->
  <script>
    (() => {
      const saved = localStorage.getItem('prm-theme')
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.dataset.theme = saved
      }
    })()
  </script>

  <link rel="preload" href="./fonts/karla.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./app.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <meta name="theme-color" content="#faf7f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)">
  <!-- iOS ignores the manifest's display mode and reads these instead. The
       apple- prefix is deprecated in Chrome but still required by Safari. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PRM">
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="#/">
        <svg viewBox="0 0 512 512" aria-hidden="true" focusable="false">
          <rect width="512" height="512" rx="113" fill="var(--accent)"/>
          <g stroke="var(--paper)" stroke-width="26" stroke-linecap="round" fill="none">
            <path d="M256 174 164 338M256 174l92 164M164 338h184"/>
          </g>
          <g fill="var(--paper)">
            <circle cx="256" cy="174" r="52"/><circle cx="164" cy="338" r="52"/>
            <circle cx="348" cy="338" r="52"/>
          </g>
        </svg>
        <span>PRM</span>
      </a>

      <nav class="tabs">
        <a href="#/" data-route="">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <span>Today</span>
        </a>
        <a href="#/contacts" data-route="contacts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M3 19.5c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.6a3.5 3.5 0 0 1 0 6.3M17.5 14.4c2.1.6 3.5 2.4 3.5 5.1"/></svg>
          <span>Contacts</span>
        </a>
        <a href="#/settings" data-route="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6.5" rx="7.5" ry="3"/><path d="M4.5 6.5v11c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-11"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg>
          <span>Data</span>
        </a>
      </nav>

      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Theme">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="i-auto"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="i-light"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="i-dark"><path d="M20 14.3A8.5 8.5 0 0 1 9.7 4a8.5 8.5 0 1 0 10.3 10.3z"/></svg>
      </button>
    </div>
  </header>

  <main id="app">
    <div class="booting"><span class="spinner" aria-hidden="true"></span>
      <p class="muted">Opening your database&hellip;</p>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
